name: Python CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python tools/prepare_public_repository.py
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q
        env:
          RUN_API_REQUEST_TESTS: "1"
          RUN_UI_TESTS: "1"
          APP_MODE: ephemeral
          ENABLE_AI: "false"
          MARKET_DATA_MODE: withheld
